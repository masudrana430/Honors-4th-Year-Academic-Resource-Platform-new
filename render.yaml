services:
  - type: web
    name: honors-4th-year-academic-platform
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run db:seed && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: honors-4th-year-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_DRIVE_PRIVATE_KEY
        sync: false
      - key: ADMIN_UPLOAD_TOKEN
        sync: false

databases:
  - name: honors-4th-year-db
    plan: free
    databaseName: honors_db
    user: honors_user
